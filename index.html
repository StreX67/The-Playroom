<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Kasyno P.Z</title>
<style>
body{margin:0;font-family:Arial;background:#1b1b1b;color:white;text-align:center;}
.topbar{background:#222;padding:15px;}
.menu a{display:inline-block;padding:10px 15px;margin:5px;background:#444;color:white;text-decoration:none;border-radius:8px;}
.menu a:hover{background:#666;}
.stats{margin-top:20px;padding:15px;background:#222;}
.loginBox{position:fixed;top:0;left:0;width:100%;height:100%;background:#000c;display:flex;justify-content:center;align-items:center;flex-direction:column;z-index:999;}
.loginBox input{padding:10px;font-size:18px;margin:10px;color:black;}
.loginBox button{padding:10px 20px;font-size:18px;cursor:pointer;}
.ranking{margin-top:20px;padding:15px;background:#111;}
.ranking div{padding:6px;border-bottom:1px solid #333;}
</style>
</head>
<body>

<div id="loginBox" class="loginBox">
    <h2>Logowanie 🎮</h2>
    <input type="text" id="nicknameInput" placeholder="Nick">
    <input type="password" id="passwordInput" placeholder="Hasło (max 8 znaków)">
    <button onclick="loginUser()">Zaloguj / Zarejestruj</button>
    <p id="loginError" style="color:red;font-size:14px;margin-top:8px;"></p>
</div>

<div class="topbar">
    <h1>🎰 Kasyno P.Z</h1>
    <button onclick="toggleStatsPanel()" style="margin-top:10px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;">?</button>
    <button onclick="logout()" style="margin-top:10px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;background:#c0392b;color:white;">Wyloguj</button>
</div>

<div class="menu">
    <a href="ruletka.html">🎯 Ruletka</a>
    <a href="blackjack.html">🎴 Blackjack</a>
    <a href="moneta.html">🪙 Moneta</a>
    <a href="mines.html">💣 Miny</a>
    <a href="wyscigi.html">🐎 Wyścigi</a>
    <a href="case-opener.html">🎰 Case Opener</a>

    <a href="statki.html">🚢 Statki</a>
    <a href="go-up.html">⬆️ GO UP</a>
</div>

<div class="stats">
    <h2>📊 Statystyki</h2>
    <p id="playerNick"></p>
    <p id="playerMoney"></p>
</div>

<div class="ranking">
    <h2>🏆 Ranking TOP 20 (aktywni ≤7 dni)</h2>
    <div id="rankingList"></div>
</div>

<br>
<button onclick="resetGame()">🔄 Reset gry</button>

<div id="allPlayersPanel" style="display:none;margin:20px auto;padding:15px;background:#222;max-width:700px;border-radius:12px;">
    <h2>📋 Statystyki graczy</h2>
    <div id="allPlayersList"></div>
</div>

<!-- Firebase COMPAT – działa jak zwykły <script>, bez type=module -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
firebase.initializeApp({
    apiKey: "APIKEY",
    authDomain: "kasynopz.firebaseapp.com",
    databaseURL: "https://kasynopz-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "kasynopz",
    storageBucket: "kasynopz.firebasestorage.app",
    messagingSenderId: "816405578915",
    appId: "APPID"
});

const db = firebase.database();
let currentUser = null;

// ── Auto login ──────────────────────────────────────────
const savedNick = localStorage.getItem("casinoNick");
const savedPass = localStorage.getItem("casinoPass");
const savedLogged = localStorage.getItem("casinoLogged");

if(savedNick && savedPass && savedLogged === "1"){
    // Od razu ukryj ekran logowania – nie czekamy na Firebase
    document.getElementById("loginBox").style.display = "none";
    currentUser = savedNick;
    const savedMoney = parseInt(localStorage.getItem("saldo")) || 0;
    showStats(savedNick, savedMoney);
    // W tle zweryfikuj dane z Firebase i odśwież saldo
    setTimeout(()=>{
        login(savedNick, savedPass, true);
    }, 100);
}

// Enter w polu hasła
document.getElementById("passwordInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") loginUser();
});

// ── Logowanie / rejestracja ─────────────────────────────
function loginUser() {
    const nick = document.getElementById("nicknameInput").value.trim();
    const pass = document.getElementById("passwordInput").value;
    document.getElementById("loginError").innerText = "";

    if (!nick || nick.length < 2) {
        document.getElementById("loginError").innerText = "Podaj nick (min 2 znaki)!";
        return;
    }
    if (!pass || pass.length > 8) {
        document.getElementById("loginError").innerText = "Hasło 1–8 znaków!";
        return;
    }
    login(nick, pass, false);
}

function login(nick, pass, silent) {
    const playerRef = db.ref("players/" + nick);
    const now = Date.now();

    playerRef.get().then(function(snapshot) {
        if (snapshot.exists()) {
            const data = snapshot.val();

            if (data.pass !== pass) {
                if (!silent) {
                    document.getElementById("loginError").innerText = "Złe hasło!";
                } else {
                    document.getElementById("loginBox").style.display = "flex";
                }
                return;
            }

            playerRef.update({ lastLogin: now });
            currentUser = nick;
            localStorage.setItem("casinoNick", nick);
            localStorage.setItem("casinoPass", pass);
            localStorage.setItem("saldo", data.money);
            localStorage.setItem("casinoLogged", "1");

            document.getElementById("loginBox").style.display = "none";
            showStats(nick, data.money);
            loadRanking();

        } else {
            // nowy gracz
            playerRef.set({
                money: 1000,
                pass: pass,
                lastLogin: now,
                lastSeen: now
            });

            currentUser = nick;
            localStorage.setItem("casinoNick", nick);
            localStorage.setItem("casinoPass", pass);
            localStorage.setItem("saldo", 1000);
            localStorage.setItem("casinoLogged", "1");

            document.getElementById("loginBox").style.display = "none";
            showStats(nick, 1000);
            loadRanking();
        }

    }).catch(function(err) {
        console.error(err);
        if (!silent) document.getElementById("loginError").innerText = "Błąd połączenia z bazą!";
    });
}

// ── Wyloguj ─────────────────────────────────────────────
function logout() {
    if (!confirm("Wylogować się?")) return;

    localStorage.removeItem("casinoLogged");

    location.reload();
}

// ── Statystyki ───────────────────────────────────────────
function showStats(nick, money) {
    document.getElementById("playerNick").innerText  = "👤 Nick: " + nick;
    document.getElementById("playerMoney").innerText = "💰 Konto: " + money + " zł";
}

// ── Ranking ──────────────────────────────────────────────
function loadRanking() {
    db.ref("players").get().then(function(snap) {
        if (!snap.exists()) {
            document.getElementById("rankingList").innerHTML = "Brak graczy";
            return;
        }
        const now = Date.now();
        const sevenDays = 7 * 24 * 60 * 60 * 1000;
        let players = [];

        snap.forEach(function(child) {
            const data = child.val();
            if (data.lastLogin && (now - data.lastLogin) <= sevenDays) {
                players.push({ nick: child.key, money: data.money });
            }
        });

        players.sort((a, b) => b.money - a.money);

        let html = "";
        players.slice(0, 20).forEach((p, i) => {
            html += `<div>${i + 1}. ${p.nick} – ${p.money} zł</div>`;
        });
        document.getElementById("rankingList").innerHTML = html || "Brak aktywnych graczy";
    });
}

// ── Reset ────────────────────────────────────────────────
function resetGame() {
    if (!confirm("Na pewno zresetować konto do 1000 zł?")) return;
    const nick = localStorage.getItem("casinoNick");
    if (nick) {
        db.ref("players/" + nick).update({ money: 1000 });
        localStorage.setItem("saldo", 1000);
            localStorage.setItem("casinoLogged", "1");
    }
    location.reload();
}

// ── Panel wszystkich graczy ──────────────────────────────
function toggleStatsPanel() {
    const panel = document.getElementById("allPlayersPanel");
    panel.style.display = panel.style.display === "none" ? "block" : "none";
    if (panel.dataset.loaded === "1") return;

    db.ref("players").get().then(function(snap) {
        let html = "";
        const now = Date.now();
        const week = 7 * 24 * 60 * 60 * 1000;

        if (snap.exists()) {
            snap.forEach(function(child) {
                const data = child.val();
                const lastSeen = data.lastSeen || data.lastLogin || now;
                if ((now - lastSeen) <= week) {
                    const days = Math.floor((now - lastSeen) / (1000 * 60 * 60 * 24));
                    html += `<div style="padding:10px;border-bottom:1px solid #444;">
                        <b>${child.key}</b><br>
                        💰 Kasa: ${data.money || 0} zł<br>
                        🕒 Aktywny ${days} dni temu
                    </div>`;
                }
            });
        }

        document.getElementById("allPlayersList").innerHTML = html || "<p>Brak aktywnych graczy.</p>";
        panel.dataset.loaded = "1";
    });
}

// ── Aktualizacja aktywności co minutę ────────────────────
setInterval(function() {
    if (!currentUser) return;
    db.ref("players/" + currentUser).update({ lastSeen: Date.now() });
}, 60000);

loadRanking();
</script>

</body>
</html>
